<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VectorWarp · Live radar</title>
  <link rel="icon" href="/favicon/vectorwarp-vw.svg" type="image/svg+xml">
  <script src="./lib/plotly-2.20.0.min.js"></script>
  <link rel="stylesheet" href="./lib/blah2.css?v=mobile-fullscreen-1">
</head>
<body data-capture-controls="true">
  <main class="app-shell"><header class="app-header"></header>
    <section class="page-intro"><h1 class="page-title">Live delay–Doppler radar</h1></section>
    <section class="panel radar-panel" aria-label="Live radar visualization"><label class="radar-overlay-control">Radar markers<select id="radar-overlay-mode"><option value="all">Detections + tracks</option><option value="tracks">Tracks only</option><option value="detections">Detections only</option></select></label><div class="radar-overlay-key" aria-label="Radar marker key"><span data-overlay-kind="detections"><i class="raw"></i>Raw detection</span><span data-overlay-kind="tracks"><i class="track"></i>Updated track</span><span data-overlay-kind="tracks"><i class="coasting"></i>Coasting track</span><span><i class="adsb"></i>ADS-B</span></div><div class="visualization" id="data"></div></section>
  </main>
  <script>var urlMap = '/api/map';</script>
  <script src="./js/common.js?v=mobile-fullscreen-1"></script><script>renderAppHeader('radar');</script>
  <script src="./js/plot_map.js?v=mobile-fullscreen-1"></script>
</body>
</html>
