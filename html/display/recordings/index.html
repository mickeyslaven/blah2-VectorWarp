<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VectorWarp · Recordings</title><link rel="stylesheet" href="../../lib/blah2.css?v=loading-1"></head>
<body><main class="app-shell recordings-shell"><header class="app-header"></header>
<section class="controller-intro"><div><h1>Recordings</h1><p>Browse, import, replay and manage manual recordings and automatic aircraft clips.</p></div><a class="button-link" href="/display/configuration">Recording settings</a></section>
<section class="recording-library-summary panel" id="recording-library-summary" aria-live="polite">Reading recording storage…</section>
<section class="recording-tools panel" aria-label="Recording library tools"><div class="recording-browser-controls">
<label>Search all recordings<input id="recording-search" type="search" placeholder="Flight, ICAO, receiver, or filename" autocomplete="off"></label>
<label>Type<select id="recording-kind"><option value="">All recordings</option><option value="automatic">Aircraft clips</option><option value="manual">Manual</option></select></label>
<label>Sort<select id="recording-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="largest">Largest first</option><option value="smallest">Smallest first</option></select></label>
<button id="recording-refresh" type="button">Refresh</button></div>
<div class="recording-import-controls"><label class="button-link button-secondary" for="recording-import">Import .blah2iq or .mchq</label><input id="recording-import" type="file" accept=".blah2iq,.mchq" hidden><span id="recording-import-status" role="status" aria-live="polite">Imports are copied into the configured VectorWarp recording folder.</span></div></section>
<div class="recording-page-status" id="recording-page-status" aria-live="polite"></div>
<section id="recording-list" class="recording-list" aria-live="polite"><p>Loading recordings…</p></section>
<nav class="recording-pagination" aria-label="Recording pages"><button id="recording-previous" class="button-secondary" type="button">Previous</button><span id="recording-page">Page 1</span><button id="recording-next" class="button-secondary" type="button">Next</button></nav>
</main><script src="../../js/common.js?v=stateful-refresh-1"></script><script src="../../js/recordings.js?v=loading-1"></script><script>renderAppHeader('recordings');renderRecordings();</script></body></html>
