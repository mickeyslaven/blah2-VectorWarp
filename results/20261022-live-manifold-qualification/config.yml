        - 2
        - 3
        - 4
      ula_half_plane: both
      operator_reported_ch0_heading_deg: 80
      operator_heading_reference: true north
      operator_notes: >-
        Arrow five-boom UCA with 440 MHz dipoles at the physical 600 MHz (hole 9) radius setting.
        After the 2026-10-18 roof move, the array was raised approximately one foot without
        intentional rotation; CH0 remains at the previously established true bearing of 80 degrees.
        CH1-CH4 proceed clockwise in 72-degree steps. Manufacturer hole radius is 7.62 inches
        (0.193548 m).
      elements:
        - id: CH0
          daq_channel: 0
          receiver_serial: "1000"
          position:
            - 0.193548
            - 0
            - 0
        - id: CH1
          daq_channel: 1
          receiver_serial: "1001"
          position:
            - 0.059809621
            - -0.184075087
            - 0
        - id: CH2
          daq_channel: 2
          receiver_serial: "1002"
          position:
            - -0.156583621
            - -0.11376466
            - 0
        - id: CH3
          daq_channel: 3
          receiver_serial: "1003"
          position:
            - -0.156583621
            - 0.11376466
            - 0
        - id: CH4
          daq_channel: 4
          receiver_serial: "1004"
          position:
            - 0.059809621
            - 0.184075087
            - 0
  replay:
    state: false
    loop: false
    file: /var/lib/vectorwarp/recordings/recording.blah2iq
    format: auto
process:
  performance:
    surveillance_workers: 2
    fft_threads: 1
    acceleration: gpu-resident
  data:
    cpi: 0.5
    buffer: 2
    overlap: 0
  ambiguity:
    delayMin: -10
    delayMax: 500
    dopplerMin: -600
    dopplerMax: 600
  clutter:
    enable: true
    delayMin: -10
    delayMax: 500
    followAmbiguity: false
  reference_synthesis:
    mode: array_eigenbeam
    channels:
      - 0
      - 1
      - 2
      - 3
      - 4
    analysis_samples: 32768
    analysis_interval: 10
    power_iterations: 12
    covariance_smoothing: 0.8
    diagonal_loading: 0.001
  detection:
    enable: true
    pfa: 0.005
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 0
    nCentroid: 6
    integration_cpis: 1
    integration_motion_bins: 0
    track_before_detect:
      enable: true
      max_cpis: 8
      motion_bins: 1
      delay_motion_bins: 2
      doppler_motion_bins: 4
  tracker:
    enable: true
    initiate:
      M: 3
      "N": 5
      maxAcc: 10
      acceleration_model: adaptive_gate
    delete: 10
    smooth: none
    gpu_capacity: 4096
    publication:
      mode: hybrid
      event_file: /var/lib/vectorwarp-api/tracker/unassisted.jsonl
      stale_after_s: 3
      native_min_associations: 5
      delay_tolerance: 2
      doppler_tolerance: 5
    track_guided_shadow:
      enable: true
      promote: true
      max_tracks: 64
  surveillance_fusion:
    mode: coherent_beam_bank
    beams: 12
    effective_beam_trials: 5
    direct_path_null_db: 0
  bearing:
    enable: false
    min_consistent: 3
    min_peak_separation_db: 3
    method: covariance_mvdr
    reference_anchor: fixed_site
    scan_beams: 60
    candidate_peaks: 3
    guard_radius: 1
    training_radius: 3
    diagonal_loading: 0.01
    channel_mapping:
      - 0
      - 1
      - 2
      - 3
      - 4
    manifold_recorder:
      enabled: "on"
      path: /var/lib/vectorwarp-api/calibration/manifold-samples.jsonl
      min_snr_db: 6
      min_elevation_deg: 0
      max_elevation_deg: 15
      max_delay_error_km: 0.25
      max_doppler_error_hz: 5
      max_truth_age_s: 3
      max_file_mb: 64
      max_files: 4
    frequency_resolved_shadow:
      enabled: true
      fft_size: 2048
      subbands: 24
      bandwidth_fraction: 0.9
      diagonal_loading: 0.01
      capture_seconds: 0.25
      interval_s: 300
      timeout_ms: 15000
    manifold_automation:
      auto_promote: false
