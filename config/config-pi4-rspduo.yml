# Pi 4B / RSPduo benchmark-matched example; see docs/PI4_GUIDE.md.
# Set your actual transmitter frequency, receiver serial and site coordinates.
capture:
  fs: 2000000
  fc: 551000000
  aircraft_clips: {enabled: false, pre_seconds: 2, post_seconds: 3,
    minimum_slant_range_km: 0, maximum_slant_range_km: 1000,
    minimum_elevation_deg: 0, maximum_elevation_deg: 90,
    minimum_interval_seconds: 5}
  device:
    type: "RspDuo"
    # Leave blank only when exactly one RSPduo is connected.
    serial: ""
    agcSetPoint: -20
    # 0 to disable AGC
    #bandwidthNumber: 0
    bandwidthNumber: 5
    gainReduction: [50, 45]
    lnaState: 1
    dabNotch: false
    rfNotch: false
  replay:
    state: false
    loop: false
    file: '/var/lib/vectorwarp/recordings/recording.blah2iq'
    format: 'auto'
    provenance: 'legacy-unqualified'

process:
  performance:
    acceleration: auto
    surveillance_workers: 1
    fft_threads: 4
  data:
    cpi: 0.5
    buffer: 2
  ambiguity:
    delayMin: -10
    delayMax: 400
    dopplerMin: -300
    dopplerMax: 300
  clutter:
    enable: true
    # Covers ambiguity.delayMin through ambiguity.delayMax (inclusive).
    followAmbiguity: true
    delayMin: -10
    delayMax: 400
  detection:
    enable: true
    pfa: 0.00001
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 15
    nCentroid: 6
    integration_cpis: 1
    integration_motion_bins: 0
    track_before_detect:
      enable: false
      max_cpis: 8
      motion_bins: 1
  tracker:
    enable: true
    profile: balanced
    track_guided_shadow:
      enable: false
      promote: false
      max_tracks: 64
    initiate:
      M: 4
      N: 6
      maxAcc: 10
      min_snr_db: 5
      acceleration_model: hypothesis_bank
    delete: 3
  bearing:
    enable: false
    min_consistent: 3
    min_peak_separation_db: 3
    frequency_resolved_shadow:
      enabled: false
      fft_size: 2048
      subbands: 24
      bandwidth_fraction: 0.9
      diagonal_loading: 0.01
      capture_seconds: 0.25
      interval_s: 300
      timeout_ms: 15000
    manifold_automation:
      auto_promote: true

network:
  ip: 0.0.0.0
  ports:
    api: 3000
    map: 3001
    detection: 3002
    track: 3003
    bearing: 3004
    timestamp: 4000
    timing: 4001
    iqdata: 4002
    config: 4003

truth:
  adsb:
    enabled: false
    tar1090: 'localhost:8080'
    aircraft_photo_provider: disabled
    poll_interval: 1
    smoothing_window: 10
    max_position_age: 30
    provisional_event_time_uncertainty_s: 1
  remote_id:
    enabled: false
    source: '127.0.0.1:8754'
    poll_interval: 0.5
    source_timeout: 1.2
    smoothing_window: 4
    max_position_age: 10
    wifi_enabled: false

location:
  rx:
    # Replace these neutral placeholders before enabling capture or truth data.
    latitude: 0
    longitude: 0
    altitude: 0
    name: "Set receiver site"
  tx:
    latitude: 0
    longitude: 0
    altitude: 0
    name: "Set transmitter site"

save:
  iq: false
  map: false
  detection: false
  timing: false
  path: "/var/lib/vectorwarp/recordings/"
  retention:
    automatic_cleanup: false
    low_space_policy: stop_recording
    maximum_age_days: 30
    maximum_total_gb: 100
    minimum_free_gb: 5
