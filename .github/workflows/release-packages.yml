name: Build release packages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # The validation job below enforces exact vMAJOR.MINOR.PATCH semantics;
    # keep the event filter broad so valid tags are never lost to glob syntax.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dry-run, without the v prefix (for example 1.2.3)'
        required: false
        type: string
      publish:
        description: 'Promote the exact soaked candidate to a draft from the selected immutable tag'
        type: boolean
        default: false
      candidate_run_id:
        description: 'Successful explicit main package run to promote; required for publish'
        type: string
        required: false
      soak_receipt:
        description: 'JSON with bindingJson (exact raw binding text) and summary; required for publish'
        type: string
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      tagged_release: ${{ steps.version.outputs.tagged_release }}
      matrix: ${{ steps.artifacts.outputs.matrix }}
    steps:
      - name: Check out tag or dry-run revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: artifacts
        name: Read the reviewed artifact matrix
        run: echo "matrix=$(python3 script/artifact-plan.py matrix)" >> "$GITHUB_OUTPUT"
      - id: version
        name: Reject mutable or malformed versions
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ $PUBLISH == true && $GITHUB_REF_TYPE != tag ]]; then
            echo 'Publication must be dispatched from an immutable version tag.' >&2; exit 1
          fi
          if [[ ${GITHUB_REF_TYPE} == tag ]]; then
            tag=${GITHUB_REF_NAME}
            tagged_release=true
            git show-ref --verify --quiet "refs/tags/${tag}"
            [[ $(git rev-list -n 1 "${tag}") == "${GITHUB_SHA}" ]]
            git show-ref --verify --quiet refs/remotes/origin/main
            [[ $(git rev-parse refs/remotes/origin/main) == "${GITHUB_SHA}" ]] || {
              echo 'Stable tags must point to the exact current main commit.' >&2; exit 1; }
          elif [[ ${GITHUB_EVENT_NAME} == pull_request ||
                  ( ${GITHUB_EVENT_NAME} == push && ${GITHUB_REF} == refs/heads/main ) ]]; then
            # A high review-only version exercises real installed upgrades.
            # PR/main candidates cannot reach protected publication jobs.
            tag=v9999.0.0
            tagged_release=false
          else
            [[ ${GITHUB_EVENT_NAME} == workflow_dispatch ]]
            [[ ${GITHUB_REF_TYPE} == branch && ${GITHUB_REF_NAME} == main ]]
            git show-ref --verify --quiet refs/remotes/origin/main
            [[ $(git rev-parse refs/remotes/origin/main) == "${GITHUB_SHA}" ]] || {
              echo 'Unsigned test packages must be built from the exact current main commit.' >&2; exit 1; }
            tag="v$INPUT_VERSION"
            tagged_release=false
          fi
          [[ $tag =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo 'Version must be an immutable stable vMAJOR.MINOR.PATCH tag.' >&2; exit 1; }
          printf 'tag=%s\nversion=%s\ntagged_release=%s\n' "$tag" "${tag#v}" "$tagged_release" >> "$GITHUB_OUTPUT"
  fedora-pam:
    name: Fedora container authentication (${{ matrix.runner }})
    needs: validate
    if: inputs.publish != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install disposable test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman
      - name: Check Fedora sudo and record host authentication denials
        run: sudo python3 test/packaging/fedora_apparmor_ci.py -- python3 test/packaging/fedora_pam_preflight.py --evidence fedora-pam-evidence
      - name: Preserve authentication preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-pam-${{ matrix.runner }}-${{ github.sha }}
          path: fedora-pam-evidence/
          if-no-files-found: warn
          retention-days: 14
  verify:
    # Retain the required-check identity; this job does not use a vendor SDK.
    name: Verify CPU unit, API, and replay tests
    needs: validate
    if: inputs.publish != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: node-pin
        run: version=$(python3 script/artifact-plan.py pin node) && echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node 24 for API tests
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          package-manager-cache: false
      - name: Install CPU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake curl git ninja-build pkg-config python3-yaml tar unzip xz-utils zip \
            apt-utils createrepo-c gnupg libarmadillo-dev libfftw3-dev libasio-dev rapidjson-dev rpm libuhd-dev uhd-host libboost-dev libhackrf-dev libusb-1.0-0-dev libeigen3-dev libssl-dev zlib1g-dev patch
      - name: Bootstrap pinned vcpkg manifest dependencies
        run: |
          python3 script/artifact-plan.py checkout vcpkg build/ci-deps/vcpkg
          build/ci-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p build/ci-manifest
          cp lib/vcpkg.json build/ci-manifest/vcpkg.json
      - name: Configure and test without GPU hardware
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DBLAH2_KRAKEN_ONLY=OFF -DBLAH2_GPU=OFF -DBLAH2_OUTPUT_DIR="$PWD/build/ci/bin" \
            -DBLAH2_ENABLE_RSPDUO=OFF -DBLAH2_ENABLE_USRP=ON -DBLAH2_ENABLE_HACKRF=ON \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/ci-deps/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$PWD/build/ci-manifest" -DVCPKG_INSTALLED_DIR="$PWD/build/ci/vcpkg_installed"
          python3 script/prebuild_acceptance.py --build-dir build/ci \
            --native-target blah2 --native-target testDetectionMath --native-target testTracker \
            --native-target testFrontendPlan --native-test frontendPlanParity \
            --native-test testDetectionMath --native-test testTracker --receipt build/ci/prebuild-acceptance.json
          cmake --build build/ci --parallel 2
          ctest --test-dir build/ci --output-on-failure --no-tests=error
      - name: Run offline full-processor replay harness
        run: python3 test/recording/processor_replay_test.py --binary build/ci/bin/blah2
      - name: Verify GPU platform and receiver build contracts
        run: |
          python3 test/packaging/test_gpu_platform_contract.py -v
          python3 test/packaging/test_ci_workflows.py -v
          python3 test/packaging/test_release_soak.py -v
          python3 test/packaging/test_release_ci.py -v
      - name: Run repository generator unit and ephemeral integration tests
        run: |
          python3 test/packaging/test_repository.py -v
          VECTORWARP_REPOSITORY_INTEGRATION=1 python3 test/packaging/test_repository.py -v
      - name: Run API and UI unit tests
        env:
          NODE_PATH: ${{ github.workspace }}/api/node_modules
        run: |
          VECTORWARP_LAUNCHER_TEST_API="$PWD/api" VECTORWARP_LAUNCHER_TEST_NODE="$(command -v node)" python3 test/packaging/test_launcher.py -v
          npm test --prefix api
          npm run test:dom --prefix api
          node test/ui/deployment.test.js
      - name: Exercise real unprivileged broker requests with NoNewPrivileges
        run: |
          sudo env "PATH=$PATH" "VECTORWARP_TEST_NODE=$(command -v node)" \
            "NODE_PATH=$GITHUB_WORKSPACE/api/node_modules" \
            python3 test/packaging/test_receiver_helper.py -v
          sudo python3 test/packaging/test_sudoers_migration.py -v
      - name: Check packaging policy and fake SDK inputs (no real SDRplay SDK)
        run: |
          node test/ui/packaging.test.js
          python3 test/packaging/test_install_docs.py -v
          python3 test/packaging/test_fedora_pam_preflight.py -v
          python3 test/packaging/test_fedora_apparmor_ci.py -v
          python3 test/packaging/test_gpu_setup.py -v
          python3 test/packaging/test_receiver_build.py -v
          sudo python3 test/packaging/test_package_upgrade.py -v
          node test/packaging/upgrade_state.test.js
          python3 test/packaging/test_smoke_receiver_status.py -v
          python3 test/packaging/test_sdrplay_distribution.py -v
          python3 test/packaging/test_rpm_local_kit.py -v
      - name: Preserve CPU package-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-package-gate-${{ github.sha }}
          path: build/ci/prebuild-acceptance.json
          if-no-files-found: warn
          retention-days: 14
  package:
    name: ${{ matrix.distro }} ${{ matrix.arch }} package
    # Every event exercises the same local-kit all-receiver build and upgrade.
    needs: [validate, verify, fedora-pam]
    # Required package checks must fail, not become mergeable skipped checks,
    # when the disposable test OS cannot authenticate an ordinary user.
    if: always() && inputs.publish != true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    # Stable builds stage only VectorWarp's local RSPduo source kit. No job
    # receives, downloads, or caches the separately licensed SDRplay SDK.
    runs-on: ${{ matrix.runner }}
    # Hosted mirror throughput varies substantially for the disposable
    # installed-service OS: a fresh all-receiver package can pull hundreds of
    # distro dependencies before the unchanged browser/replay and upgrade
    # assertions run. Keep the complete acceptance path instead of cancelling
    # successful slow-mirror jobs at the former 60-minute ceiling.
    timeout-minutes: 120
    steps:
      - name: Require successful build and test-environment prerequisites
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PAM_RESULT: ${{ needs.fedora-pam.result }}
        run: test "$VALIDATE_RESULT" = success && test "$VERIFY_RESULT" = success && test "$PAM_RESULT" = success
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install disposable package test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman uidmap slirp4netns
      - name: Build native Debian package
        if: matrix.distro == 'ubuntu24.04'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake curl dpkg-dev file git ninja-build pkg-config python3 sudo tar unzip util-linux xz-utils zip \
            libarmadillo-dev libfftw3-dev libvulkan-dev glslang-dev glslang-tools libuhd-dev uhd-host libboost-dev libhackrf-dev libusb-1.0-0-dev libeigen3-dev libssl-dev zlib1g-dev patch
          python3 script/artifact-plan.py native-package --format deb \
            --version "$VERSION" --distro "${{ matrix.distro }}" --node-arch "$NODE_ARCH"
      - name: Build native Ubuntu 22.04/26.04 or Debian 12/13 package in pinned isolated userspace
        if: matrix.distro == 'ubuntu22.04' || matrix.distro == 'ubuntu26.04' || matrix.distro == 'debian12' || matrix.distro == 'debian13'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          set -euo pipefail
          podman run --rm --userns=keep-id --user root --security-opt label=disable \
            -e VERSION -e NODE_ARCH \
            -v "$GITHUB_WORKSPACE:/src:Z" -w /src \
            ${{ matrix.image }} \
            bash -euo pipefail -c '
              test/packaging/apt-install-with-retry.sh \
                build-essential ca-certificates cmake curl dpkg-dev file git ninja-build pkg-config python3 sudo tar unzip util-linux xz-utils zip \
                libarmadillo-dev libfftw3-dev libvulkan-dev glslang-dev glslang-tools libuhd-dev uhd-host libboost-dev libhackrf-dev libusb-1.0-0-dev libeigen3-dev libssl-dev zlib1g-dev patch
              git config --global --add safe.directory /src
              python3 script/artifact-plan.py native-package --format deb \
                --version "$VERSION" --distro "${{ matrix.distro_env }}" --node-arch "$NODE_ARCH"
            '
      - name: Build native Fedora RPM in isolated Fedora userspace
        if: matrix.format == 'rpm'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          set -euo pipefail
          podman run --rm --userns=keep-id --user root --security-opt label=disable \
            -e VERSION -e NODE_ARCH \
            -v "$GITHUB_WORKSPACE:/src:Z" -w /src \
            ${{ matrix.image }} \
            bash -euo pipefail -c '
              dnf --assumeyes install ca-certificates cpio file gcc-c++ cmake curl git ninja-build pkgconf-pkg-config python3 sudo tar unzip util-linux xz zip \
                fftw-devel armadillo-devel vulkan-loader-devel glslang-devel rpm-build uhd-devel boost-devel hackrf-devel libusb1-devel eigen3-devel openssl-devel zlib-devel patch
              git config --global --add safe.directory /src
              python3 script/artifact-plan.py native-package --format rpm \
                --version "$VERSION" --distro "fedora44" --node-arch "$NODE_ARCH"
            '
      - id: node-pin
        run: version=$(python3 script/artifact-plan.py pin node) && echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up browser-test Node (test runner only)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          package-manager-cache: false
      - name: Install isolated browser-test dependencies (not packaged)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vectorwarp-test-browsers
        run: |
          npm ci --prefix test/browser --ignore-scripts --no-audit --no-fund
          test/browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
          node test/browser/locations.cjs
      - name: Prove a fresh package starts its installed services and works in Chromium
        env:
          DISTRO: ${{ matrix.distro }}
          PINNED_IMAGE: ${{ matrix.image }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vectorwarp-test-browsers
        run: |
          set -euo pipefail
          case "$DISTRO" in
            ubuntu24.04) image=docker.io/library/ubuntu:24.04 ;;
            fedora44) image=registry.fedoraproject.org/fedora@sha256:c1e938afd5dfd7f172fac9168ba8e148fdf41c0517c04849072a15e4bd34eac6 ;;
            *) image=$PINNED_IMAGE ;;
          esac
          package=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print -quit)
          test_command=(bash script/test-installed-package.sh --package "$package" --image "$image"
            --evidence service-evidence --browser-modules test/browser/node_modules)
          if [[ $DISTRO == fedora44 ]]; then
            test_command=(python3 test/packaging/fedora_apparmor_ci.py -- "${test_command[@]}")
          fi
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
            "${test_command[@]}"
      - name: Download the previous published package for this exact target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_tag=
          if [[ $GITHUB_REF_TYPE == tag ]]; then candidate_tag=$GITHUB_REF_NAME; fi
          mkdir -p previous-package
          script/download-previous-package.sh --distro '${{ matrix.distro }}' \
            --arch '${{ matrix.arch }}' --candidate-tag "$candidate_tag" \
            --output previous-package | tee previous-package/resolution.txt
      - name: Upgrade the published package to the candidate without replacing the SDR ecosystem
        env:
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
          PINNED_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            ubuntu24.04) image=docker.io/library/ubuntu:24.04 ;;
            fedora44) image=registry.fedoraproject.org/fedora@sha256:c1e938afd5dfd7f172fac9168ba8e148fdf41c0517c04849072a15e4bd34eac6 ;;
            *) image=$PINNED_IMAGE ;;
          esac
          previous=$(find previous-package -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print -quit)
          candidate=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print -quit)
          command=(bash script/test-package-upgrade.sh --previous "$previous" \
            --candidate "$candidate" --image "$image" --evidence upgrade-evidence)
          if [[ $DISTRO == ubuntu22.04 && $ARCH == amd64 ]]; then
            command+=(--dragonos-uhd-fixture)
          fi
          if [[ $DISTRO == fedora44 ]]; then
            command=(python3 test/packaging/fedora_apparmor_ci.py -- "${command[@]}")
          fi
          sudo env "PATH=$PATH" "${command[@]}"
      - name: Preserve installed-service logs and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-service-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.sha }}
          path: service-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve published-package upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-upgrade-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            previous-package/resolution.txt
            upgrade-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Require package metadata from the packager
        run: |
          set -euo pipefail
          package=$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print -quit)
          [[ -n $package && -f "${package}.manifest.json" ]]
      - name: Upload unsigned package review inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-package-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  qualified-linux-gpu:
    # Unsigned dry runs remain usable before physical release qualification.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: validate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/gpu-receipt-gate.yml
    with:
      source-sha: ${{ github.sha }}

  sign-and-draft-release:
    name: Sign RPMs and create reviewable draft release
    # Publication deliberately has no build dependency: only the previously
    # tested and soaked candidate's exact artifacts may reach signing.
    needs: [validate, qualified-linux-gpu]
    if: >-
      github.repository == 'mickeyslaven/blah2-VectorWarp' &&
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate.outputs.tagged_release == 'true'
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful hosted checks for the exact merged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/verify-release-ci.py
      - name: Authenticate successful immutable candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          [[ $CANDIDATE_RUN_ID =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          python3 script/verify-release-soak.py candidate
      - name: Collect exact prior candidate package assets without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          pattern: unsigned-package-*
          path: packages
          merge-multiple: true
      - name: Generate immutable upstream review artifact
        run: |
          mkdir release-review
          python3 script/upstream-diff.py --baseline docs/UPSTREAM_BASELINE.json \
            --output release-review/upstream-diff.txt
          cp docs/UPSTREAM_BASELINE.json release-review/
      - name: Create and validate aggregate package manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, re
          manifests = sorted(pathlib.Path('packages').glob('*.manifest.json'))
          if len(manifests) != 11:
              raise SystemExit(f'expected eleven package manifests, found {len(manifests)}')
          entries = [json.loads(path.read_text()) for path in manifests]
          required = {'name', 'version', 'release', 'format', 'distro', 'distro_version',
                      'arch', 'filename', 'sha256', 'size', 'backend', 'compiled_receivers',
                      'local_build_receivers', 'test_only', 'gpu', 'node_version'}
          if any(not required.issubset(entry) for entry in entries):
              raise SystemExit('package manifest is incomplete')
          version = os.environ['VERSION']
          source_commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', source_commit):
              raise SystemExit('source commit must be a full Git object ID')
          if any(entry['version'] != version for entry in entries):
              raise SystemExit('every package must match the immutable tag version')
          expected = {
              ('deb', 'ubuntu', '22.04', arch) for arch in ('amd64', 'arm64')
          } | {
              ('deb', 'ubuntu', '24.04', arch) for arch in ('amd64', 'arm64')
          } | {
              ('deb', 'ubuntu', '26.04', arch) for arch in ('amd64', 'arm64')
          } | {
              ('deb', 'debian', '12', 'arm64')
          } | {
              ('deb', 'debian', '13', arch) for arch in ('amd64', 'arm64')
          } | {
              ('rpm', 'fedora', '44', arch) for arch in ('x86_64', 'aarch64')
          }
          actual = {(entry['format'], entry['distro'], entry['distro_version'], entry['arch'])
                    for entry in entries}
          if actual != expected:
              raise SystemExit(f'package target matrix mismatch: missing={expected-actual}, extra={actual-expected}')
          pathlib.Path('packages/package-manifest.json').write_text(json.dumps({
              'schema': 1, 'generated_at': datetime.datetime.now(datetime.UTC).isoformat(),
              'version': version, 'source_commit': source_commit.lower(),
              'packages': entries}, indent=2) + '\n')
          PY
      - name: Install repository signing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils createrepo-c gnupg rpm rpm2cpio cpio
      - name: Verify 24-hour soak against exact candidate package payloads
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          VECTORWARP_SOAK_RECEIPT: ${{ inputs.soak_receipt }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 script/verify-release-soak.py verify
      - name: Fail closed unless repository signing is configured
        env:
          SIGNING_KEY: ${{ secrets.VECTORWARP_ARCHIVE_SIGNING_KEY }}
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n $SIGNING_KEY && $FINGERPRINT =~ ^[A-Fa-f0-9]{40}$ ]]
          [[ -f packaging/keys/vectorwarp.asc && -f script/build-package-repository.py ]]
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          actual=$(gpg --batch --with-colons --fingerprint "$FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ ${actual^^} == ${FINGERPRINT^^} ]]
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build signed, bounded repository tree
        env:
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          python3 script/build-package-repository.py --packages packages --manifest packages/package-manifest.json \
            --output repository --public-key packaging/keys/vectorwarp.asc \
            --fingerprint "$FINGERPRINT" --signing-key "$FINGERPRINT" \
            --installer-template script/install-release.sh \
            --expected-version "${{ needs.validate.outputs.version }}" \
            --expected-source-commit "${{ github.sha }}" --require-release-matrix
          test -f repository/repository-manifest.json
          test $(du -sm repository | awk '{print $1}') -le 900
      - name: Prove signing preserved the soaked payloads
        run: |
          python3 script/verify-release-soak.py signed \
            --packages repository --manifest repository/repository-manifest.json
      - name: Collect final signed release assets and checksums
        env:
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp packages/*.deb release-assets/
          find repository/rpm -type f -name 'vectorwarp-*.rpm' -exec cp {} release-assets/ \;
          # Repository RPM signatures change the package bytes. Publish only
          # the post-signing package identities and checksums from the signed tree.
          cp repository/repository-manifest.json release-assets/package-manifest.json
          cp repository/repository-manifest.json release-assets/repository-manifest.json
          cp packaging/keys/vectorwarp.asc release-assets/vectorwarp-archive-key.asc
          cp repository/keys/fingerprint.txt release-assets/signing-fingerprint.txt
          cp release-review/upstream-diff.txt release-review/UPSTREAM_BASELINE.json release-assets/
          cp release-soak-provenance.json release-assets/
          cp release-ci-provenance.json release-assets/
          (cd release-assets && sha256sum *.deb *.rpm package-manifest.json repository-manifest.json \
            upstream-diff.txt UPSTREAM_BASELINE.json vectorwarp-archive-key.asc signing-fingerprint.txt release-soak-provenance.json release-ci-provenance.json \
            > SHA256SUMS)
          gpg --batch --yes --pinentry-mode error --local-user "$FINGERPRINT" --armor --detach-sign \
            --output release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          gpgv --keyring repository/keys/vectorwarp.gpg \
            release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          test $(find release-assets -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l) -eq 11
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release already exists: $TAG" >&2; exit 1; }
          # Re-read the remote tag after the matrix completes. A local checkout
          # from validation cannot detect a moved tag during a long build.
          git fetch --no-tags origin "refs/tags/${TAG}"
          [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$GITHUB_SHA" ]] || {
            echo 'Release tag moved after validation; refusing publication.' >&2; exit 1; }
          gh release create "$TAG" --draft --verify-tag --title "VectorWarp $VERSION" \
            --notes "Explicit promotion of soaked native packages; no rebuild. Source: ${GITHUB_SHA}. Candidate: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}. Signing: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}). Signed release-soak-provenance.json binds the 24-hour host receipt and original package SHA256 to each final asset; RPM signatures may change container bytes, never payloads." \
            release-assets/*.deb release-assets/*.rpm release-assets/SHA256SUMS release-assets/SHA256SUMS.asc \
            release-assets/vectorwarp-archive-key.asc release-assets/signing-fingerprint.txt \
            release-assets/package-manifest.json release-assets/repository-manifest.json \
            release-assets/upstream-diff.txt release-assets/UPSTREAM_BASELINE.json \
            release-assets/release-soak-provenance.json release-assets/release-ci-provenance.json
