name: Build Pi 4 image candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stable package tag to consume (for example v1.2.3)'
        required: true
        type: string
      image_release_tag:
        description: 'Intended, unpublished Pi image tag (for example v1.2.3-pi4-preview)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pi-image-${{ inputs.image_release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble and verify Pi 4 candidate
    # The builder chroots into the arm64 image, so it must run native arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Validate immutable source and intended image tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_RELEASE_TAG: ${{ inputs.image_release_tag }}
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'release_tag must be a stable vMAJOR.MINOR.PATCH tag.' >&2; exit 1; }
          version=${RELEASE_TAG#v}
          image_pattern="^v${version//./\\.}-pi4(-[A-Za-z0-9][A-Za-z0-9._-]{0,120})?$"
          [[ $IMAGE_RELEASE_TAG =~ $image_pattern ]] || {
            echo 'image_release_tag must be a safe Pi 4 tag for the selected package version.' >&2; exit 1; }
          [[ $GITHUB_REPOSITORY == mickeyslaven/blah2-VectorWarp ]] || {
            echo 'Pi candidates may only consume releases from the canonical repository.' >&2; exit 1; }
          source_commit=$(git rev-parse HEAD)
          [[ $source_commit =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/vectorwarp-pi-release/${RELEASE_TAG}"
          tag_commit=$(git rev-parse "refs/vectorwarp-pi-release/${RELEASE_TAG}^{commit}")
          [[ $source_commit == $tag_commit ]] || {
            echo 'Run this workflow from the exact immutable package release tag.' >&2; exit 1; }
          printf 'version=%s\nsource_commit=%s\ndeb=vectorwarp_%s-1_debian12_arm64.deb\n' \
            "$version" "$source_commit" "$version" >> "$GITHUB_OUTPUT"
      - name: Install native image build and verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils e2fsprogs gnupg iproute2 parted rsync xz-utils
          available=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          (( available >= 32 * 1024 * 1024 * 1024 )) || {
            echo 'Pi image assembly and isolated smoke verification need at least 32 GiB free.' >&2; exit 1; }
      - name: Download and verify the signed Bookworm ARM64 package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mickeyslaven/blah2-VectorWarp
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          DEB: ${{ steps.release.outputs.deb }}
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ $FINGERPRINT =~ ^[A-Fa-f0-9]{40}$ ]]
          release=$(gh release view "$TAG" --repo "$GH_REPO" --json tagName,isDraft,isPrerelease)
          [[ $(jq -r '.tagName' <<<"$release") == "$TAG" ]]
          [[ $(jq -r '.isDraft or .isPrerelease' <<<"$release") == false ]]
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GH_REPO" --dir release-assets \
            --pattern "$DEB" --pattern SHA256SUMS --pattern SHA256SUMS.asc \
            --pattern vectorwarp-archive-key.asc --pattern signing-fingerprint.txt \
            --pattern package-manifest.json
          for file in "$DEB" SHA256SUMS SHA256SUMS.asc vectorwarp-archive-key.asc \
            signing-fingerprint.txt package-manifest.json; do
            [[ -f release-assets/$file && ! -L release-assets/$file ]]
          done
          cmp release-assets/vectorwarp-archive-key.asc packaging/keys/vectorwarp.asc
          release_fingerprint=$(tr -d '[:space:]' < release-assets/signing-fingerprint.txt)
          [[ ${release_fingerprint^^} == ${FINGERPRINT^^} ]]
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/vectorwarp-release-keyring.gpg" \
            release-assets/vectorwarp-archive-key.asc
          actual=$(gpg --batch --with-colons --show-keys release-assets/vectorwarp-archive-key.asc | \
            awk -F: '$1 == "fpr" { print $10; exit }')
          [[ ${actual^^} == ${FINGERPRINT^^} ]]
          gpgv --keyring "$RUNNER_TEMP/vectorwarp-release-keyring.gpg" \
            release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          package_sha=$(awk -v name="$DEB" '$2 == name { print $1 }' release-assets/SHA256SUMS)
          [[ $package_sha =~ ^[0-9a-fA-F]{64}$ && $(grep -cE "^[0-9A-Fa-f]{64}[[:space:]]+${DEB}$" release-assets/SHA256SUMS) == 1 ]]
          printf '%s  %s\n' "$package_sha" "release-assets/$DEB" | sha256sum --check --strict
          manifest_sha=$(awk '$2 == "package-manifest.json" { print $1 }' release-assets/SHA256SUMS)
          [[ $manifest_sha =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$manifest_sha" release-assets/package-manifest.json | sha256sum --check --strict
          jq -e --arg version "$VERSION" --arg source "$SOURCE_COMMIT" --arg filename "$DEB" \
            --arg sha "${package_sha,,}" '
              .version == $version and (.source_commit | ascii_downcase) == ($source | ascii_downcase) and
              ([.packages[] | select(.filename == $filename and .format == "deb" and .distro == "debian" and
                .distro_version == "12" and .arch == "arm64" and (.sha256 | ascii_downcase) == $sha)] | length == 1)' \
            release-assets/package-manifest.json >/dev/null
      - name: Fetch the pinned official Raspberry Pi OS base
        env:
          BASE_URL: https://downloads.raspberrypi.com/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2026-09-15/2026-09-15-raspios-bookworm-arm64-lite.img.xz
          BASE_SHA256: bcaefdf9c40dbed31dcaeb3b8494e498b4f1e3078c2604b0d9f5f595f8f6fd91
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi-image"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/pi-image/base.img.xz" "$BASE_URL"
          printf '%s  %s\n' "$BASE_SHA256" "$RUNNER_TEMP/pi-image/base.img.xz" | sha256sum --check --strict
          xz --test "$RUNNER_TEMP/pi-image/base.img.xz"
      - name: Build candidate and run structural API smoke verification
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          BASE_SHA256: bcaefdf9c40dbed31dcaeb3b8494e498b4f1e3078c2604b0d9f5f595f8f6fd91
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pi-image/vectorwarp-pi4-${VERSION}-arm64.img.xz"
          sudo packaging/pi/build-pi4-image.sh \
            --base "$RUNNER_TEMP/pi-image/base.img.xz" --base-sha256 "$BASE_SHA256" \
            --deb "release-assets/vectorwarp_${VERSION}-1_debian12_arm64.deb" \
            --output "$output" --source-revision "$SOURCE_COMMIT" --allow-network
          sudo packaging/pi/verify-pi4-image.sh --image "$output" \
            --workdir "$RUNNER_TEMP/pi-image-verify"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/pi-image"
      - name: Generate an Imager manifest for the intended unpublished tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          IMAGE_RELEASE_TAG: ${{ inputs.image_release_tag }}
        run: |
          set -euo pipefail
          image="vectorwarp-pi4-${VERSION}-arm64.img.xz"
          base="https://github.com/mickeyslaven/blah2-VectorWarp/releases/download/${IMAGE_RELEASE_TAG}"
          python3 packaging/pi/generate-imager-manifest.py \
            --image "$RUNNER_TEMP/pi-image/$image" --url "$base/$image" \
            --icon-url "https://raw.githubusercontent.com/mickeyslaven/blah2-VectorWarp/${SOURCE_COMMIT}/html/favicon/favicon-196x196.png" \
            --version "${IMAGE_RELEASE_TAG#v}" --release-date "$(date -u +%F)" \
            --output "$RUNNER_TEMP/pi-image/vectorwarp-pi4-${VERSION}.rpi-imager-manifest"
          (cd "$RUNNER_TEMP/pi-image" && sha256sum \
            "$image" "$image.provenance.json" "vectorwarp-pi4-${VERSION}.rpi-imager-manifest" > SHA256SUMS)
      - name: Upload unpublished candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi4-image-${{ steps.release.outputs.version }}-${{ inputs.image_release_tag }}
          path: |
            ${{ runner.temp }}/pi-image/vectorwarp-pi4-${{ steps.release.outputs.version }}-arm64.img.xz
            ${{ runner.temp }}/pi-image/vectorwarp-pi4-${{ steps.release.outputs.version }}-arm64.img.xz.provenance.json
            ${{ runner.temp }}/pi-image/vectorwarp-pi4-${{ steps.release.outputs.version }}.rpi-imager-manifest
            ${{ runner.temp }}/pi-image/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
