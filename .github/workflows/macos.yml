name: macOS unified GPU and receiver adapters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runtime:
    name: Browser interactions (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NODE_PATH: ${{ github.workspace }}/api/node_modules
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - id: node-pin
        run: version=$(python3 script/artifact-plan.py pin node) && echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          package-manager-cache: false
      - name: Install exact browser-test dependencies
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          npm ci --prefix test/browser --ignore-scripts --no-audit --no-fund
          cd test/browser
          npx playwright install chromium
      - name: Run exact browser interaction requirement
        env:
          VECTORWARP_LAYOUT_INTERACTIONS: '1'
          VECTORWARP_LAYOUT_REPORT: build/browser-preflight/browser-layout.json
          VECTORWARP_LAYOUT_SCREENSHOTS: build/browser-preflight/screenshots
        run: |
          VECTORWARP_CHROME_EXECUTABLE="$(node -p "require('./test/browser/node_modules/playwright').chromium.executablePath()")" \
            node test/browser/all-routes-layout.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-preflight-${{ matrix.runner }}-${{ github.sha }}
          path: build/browser-preflight/
          if-no-files-found: warn
          retention-days: 14
