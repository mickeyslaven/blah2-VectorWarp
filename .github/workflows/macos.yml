name: macOS unified GPU and receiver adapters

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime:
    # Preserve the check name used by branch protection.
    name: CPU, open receiver adapters and local lifecycle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      NODE_PATH: ${{ github.workspace }}/api/node_modules
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install open-source build dependencies
        run: brew install cmake ninja pkgconf asio rapidyaml cpp-httplib armadillo fftw rapidjson catch2 uhd hackrf eigen libusb vulkan-loader vulkan-headers molten-vk glslang
      - name: Pin VkFFT for the common Vulkan stages
        run: |
          git clone --filter=blob:none https://github.com/DTolm/VkFFT.git "$RUNNER_TEMP/VkFFT"
          git -C "$RUNNER_TEMP/VkFFT" fetch --depth=1 origin 066a17c17068c0f11c9298d848c2976c71fad1c1
          git -C "$RUNNER_TEMP/VkFFT" checkout --detach 066a17c17068c0f11c9298d848c2976c71fad1c1
          echo "VKFFT_ROOT=$RUNNER_TEMP/VkFFT" >> "$GITHUB_ENV"
      - name: Verify vendor header isolation from project warnings
        run: python3 test/macos/rapidjson_system_include_test.py
      - name: Verify GPU platform and receiver build contracts
        run: python3 test/packaging/test_gpu_platform_contract.py -v
      - name: Verify npm 11 installs the API in an absolute artifact directory
        run: python3 test/macos/build_macos_npm_install_test.py
      - name: Build unified GPU processing and open receiver adapters
        run: script/build-macos.sh --backend all --gpu on --test --jobs 3
      - name: Run synthetic processor replay
        run: |
          python3 test/recording/processor_replay_test.py --binary build/macos/artifact/bin/blah2 | tee build/macos/processor-replay.json
          build/macos/artifact/bin/blah2 --processing-capabilities > build/macos/processing-capabilities.json
          build/macos/artifact/bin/blah2 --receiver-status > build/macos/receiver-capabilities.json
          python3 test/macos/config_runtime_test.py --gpu-capable --binary build/macos/artifact/bin/blah2
          python3 test/macos/receiver_sdk_test.py --binary build/macos/artifact/bin/blah2
      - name: Probe the hosted GPU loader without claiming physical qualification
        run: |
          python3 test/macos/standalone_driver_probe.py \
            --worker build/macos/artifact/bin/blah2-gpu-worker --evidence build/macos-driver-probe \
            --icd-library "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
      - name: Preserve hosted GPU loader diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-driver-probe-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/macos-driver-probe/
            build/macos/processor-replay.json
            build/macos/processing-capabilities.json
            build/macos/receiver-capabilities.json
            build/macos/cmake/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 30
      - name: Build local Kraken controller and simulate its native USB pipeline
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          python3 script/build-kraken-macos.py --jobs 3 --test --output-dir build/macos/artifact
          python3 test/macos/kraken_adapter_test.py
          python3 test/macos/kraken/native_simulation_test.py --heimdall build/macos/artifact/bin/heimdall --include build/macos/artifact/share/heimdall/include --output build/kraken-ci-simulation
          python3 test/macos/kraken_pipeline_test.py --binary build/macos/artifact/bin/blah2 --heimdall build/macos/artifact/bin/heimdall --include build/macos/artifact/share/heimdall/include --output build/kraken-ci-pipeline
      - name: Run API and browser regressions
        run: |
          npm test --prefix api
          npm run test:dom --prefix api
          node api/macos-platform.test.js
          node api/macos-lifecycle-server.test.js
          node api/receiver-management.test.js
          node test/ui/deployment.test.js
      - name: Check the real browser locations map with synthetic data
        run: |
          npm ci --prefix test/browser --ignore-scripts --no-audit --no-fund
          cd test/browser
          npx playwright install chromium
          node locations.cjs
      - name: Run local lifecycle and actual API/CPU replay integration
        run: |
          script/vectorwarp-macos.test.sh
          python3 test/macos/processor_lifecycle_test.py --binary build/macos/artifact/bin/blah2 --endurance-seconds 360
      - name: Verify the installed Homebrew package
        env:
          HOMEBREW_MAKE_JOBS: 3
          HOMEBREW_NO_AUTOREMOVE: 1
        run: |
          script/package-homebrew-local.sh build/homebrew-ci --install-tap
          brew trust vectorwarp/local
          if [[ $(uname -m) == x86_64 ]]; then
            script/repair-macos-homebrew-python-links.sh
          fi
          brew install --build-from-source vectorwarp/local/vectorwarp
          brew test vectorwarp/local/vectorwarp
          brew test vectorwarp/local/vectorwarp-heimdall
          app_root="$(brew --prefix vectorwarp/local/vectorwarp)/libexec"
          mkdir -p "$RUNNER_TEMP/stale-node"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/stale-node/node"
          chmod +x "$RUNNER_TEMP/stale-node/node"
          PATH="$RUNNER_TEMP/stale-node:$PATH" python3 test/macos/processor_lifecycle_test.py \
            --binary "$app_root/bin/blah2" --app-root "$app_root"
          PATH="$RUNNER_TEMP/stale-node:$PATH" python3 test/macos/kraken_pipeline_test.py \
            --binary "$app_root/bin/blah2" --heimdall "$app_root/bin/heimdall" \
            --include "$app_root/share/heimdall/include" --app-root "$app_root" \
            --output build/kraken-ci-installed-pipeline
          brew uninstall vectorwarp/local/vectorwarp
          brew uninstall vectorwarp/local/vectorwarp-heimdall
          brew untap vectorwarp/local
