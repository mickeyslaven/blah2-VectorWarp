name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_gpu_receipts:
        description: 'Verify existing physical GPU qualification for this exact revision'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep the established required-check identity while expanding its coverage.
    name: CPU unit, API, and replay tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # A cold hosted runner can spend more than 20 minutes resolving the unified
    # SDR/GPU dependency set before the measured browser acceptance begins.
    # Preserve the complete gate instead of cancelling healthy work at 45 min.
    timeout-minutes: 75
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: node-pin
        run: version=$(python3 script/artifact-plan.py pin node) && echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node 24 for API tests
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          package-manager-cache: false
      - name: Install API test dependencies for the prebuild contract gate
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Install unified SDR and GPU-module build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake curl git ninja-build patch pkg-config python3-yaml tar unzip xz-utils zip \
            apt-utils createrepo-c gnupg glslang-dev glslang-tools libarmadillo-dev libfftw3-dev \
            libhackrf-dev libuhd-dev libboost-dev libusb-1.0-0-dev libvulkan-dev mesa-vulkan-drivers \
            libasio-dev rapidjson-dev rpm
      - name: Exercise SDRplay compiler privilege drop under systemd (no vendor SDK)
        run: |
          sudo python3 test/packaging/sdrplay_child_setup_test.py \
            --helper script/vectorwarp-build-sdrplay.py \
            --unit contrib/systemd/vectorwarp-sdrplay-build.service.in \
            --build-user nobody
      - name: Bootstrap pinned vcpkg manifest dependencies
        run: |
          python3 script/artifact-plan.py checkout vcpkg build/ci-deps/vcpkg
          build/ci-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p build/ci-manifest
          cp lib/vcpkg.json build/ci-manifest/vcpkg.json
          python3 script/artifact-plan.py checkout VkFFT build/ci-deps/VkFFT
      - name: Configure unified receiver and GPU-module test build
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DBLAH2_KRAKEN_ONLY=OFF -DBLAH2_ENABLE_USRP=ON \
            -DBLAH2_ENABLE_HACKRF=ON -DBLAH2_ENABLE_RSPDUO=OFF \
            -DBLAH2_LOCAL_BUILD_RSPDUO=ON \
            -DBLAH2_GPU=ON -DBLAH2_GPU_ADVANCED=ON -DBLAH2_TEST_SOFTWARE_VULKAN=ON \
            -DVKFFT_ROOT="$PWD/build/ci-deps/VkFFT" \
            -DBLAH2_OUTPUT_DIR="$PWD/build/ci/bin" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/ci-deps/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$PWD/build/ci-manifest" \
            -DVCPKG_INSTALLED_DIR="$PWD/build/ci/vcpkg_installed" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Gate source and affected native target before full build
        run: |
          python3 script/prebuild_acceptance.py \
            --build-dir build/ci \
            --native-target blah2 \
            --native-target testGpuTrackerAdmission \
            --native-target testTracker \
            --native-target testDetectionMath \
            --native-target testGpuTrackerCorrectness \
            --native-target testMultiIlluminatorRadar \
            --native-target testFrontendPlan \
            --native-test gpuTrackerCapacityAdmission \
            --native-test testTracker \
            --native-test testDetectionMath \
            --native-test residentTrackerSoftwareVulkanParity \
            --native-test multiIlluminatorRadar \
            --native-test frontendPlanParity \
            --receipt build/ci/prebuild-acceptance.json
      - name: Build configured native targets
        run: |
          cmake --build build/ci --parallel 2
      - name: Run C++ unit, resident CPU-only Vulkan parity, and portable replay tests
        # Opt-in parity uses --software and refuses physical GPU devices. The
        # protected physical-GPU receipt lane remains separately required.
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error
      - name: Verify GPU platform and receiver build contracts
        run: |
          python3 test/script/test_canonical_processing_architecture.py -v
          python3 test/packaging/test_gpu_platform_contract.py -v
          python3 test/packaging/test_release_matrix.py -v
          python3 test/gpu/test_product_parity_contract.py -v
          VECTORWARP_TEST_RECORDING_INSPECTOR="$PWD/build/ci/bin/inspectRecordingProvenance" python3 test/gpu/test_unified_corpus_contract.py -v
          python3 test/gpu/test_pre_soak_receipt_gate.py -v
          python3 test/script/test_soak_identity.py -v
          python3 test/packaging/test_ci_workflows.py -v
          python3 test/packaging/test_release_ci.py -v
      - name: Run offline replay and qualification contract regressions
        # Data-only fixtures and fake children: no RF or physical GPU qualification.
        run: |
          python3 -m unittest discover -s test/gpu -p test_recorded_iq_qualification.py
          python3 -m unittest discover -s test/script -p test_replay_session.py
          python3 -m unittest discover -s test/script -p test_run_isolated_iq_replay.py
          python3 -m unittest discover -s test/script -p test_observer_allocation_contract.py
      - name: Run offline full-processor replay harness
        run: |
          python3 test/recording/processor_replay_test.py --binary build/ci/bin/blah2 | tee build/ci/processor-replay.json
          build/ci/bin/blah2 --processing-capabilities > build/ci/processing-capabilities.json
          build/ci/bin/blah2 --receiver-status > build/ci/receiver-capabilities.json
      - name: Preserve unified CPU replay and GPU build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-ci-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/ci/Testing/Temporary/
            build/ci/prebuild-acceptance.json
            build/ci/processor-replay.json
            build/ci/processing-capabilities.json
            build/ci/receiver-capabilities.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run offline Pi packaging and diagnostics checks
        run: |
          python3 test/packaging/test_pi_image_manifest.py -v
          python3 bench/test_pi_spike_diagnostics.py -v
          python3 bench/test_live_rspduo_check.py -v
          python3 bench/test_compare_outputs.py -v
      - name: Run repository generator unit and ephemeral integration tests
        run: |
          python3 test/packaging/test_repository.py -v
          VECTORWARP_REPOSITORY_INTEGRATION=1 python3 test/packaging/test_repository.py -v
          python3 test/packaging/test_install_release.py -v
          python3 test/packaging/test_receiver_updates.py -v
          sudo python3 test/packaging/test_receiver_workflow.py -v
          python3 test/packaging/test_rpm_local_kit.py -v
          sudo python3 test/packaging/test_sdrplay_local_build.py -v
      - name: Run API and UI unit tests
        env:
          NODE_PATH: ${{ github.workspace }}/api/node_modules
        run: |
          node --test api/heimdall-timing.test.js
          python3 test/packaging/test_bundled_kraken.py -v
          VECTORWARP_LAUNCHER_TEST_API="$PWD/api" VECTORWARP_LAUNCHER_TEST_NODE="$(command -v node)" python3 test/packaging/test_launcher.py -v
          npm test --prefix api
          npm run test:receiver-management --prefix api
          npm run test:dom --prefix api
          npm test --prefix services/report-relay
          node test/ui/deployment.test.js
      - name: Exercise real unprivileged broker requests with NoNewPrivileges
        run: |
          sudo env "PATH=$PATH" "VECTORWARP_TEST_NODE=$(command -v node)" \
            "NODE_PATH=$GITHUB_WORKSPACE/api/node_modules" \
            python3 test/packaging/test_receiver_helper.py -v
          sudo python3 test/packaging/test_sudoers_migration.py -v
      - name: Run staged native-package acceptance checks
        run: |
          node test/ui/packaging.test.js
          python3 test/packaging/test_sdrplay_distribution.py -v
          python3 test/packaging/test_install_docs.py -v
          python3 test/packaging/test_gpu_setup.py -v
          python3 test/packaging/test_receiver_build.py -v
          sudo python3 test/packaging/test_package_upgrade.py -v
          node test/packaging/upgrade_state.test.js
      - name: Check all browser routes and responsive states
        if: matrix.runner == 'ubuntu-24.04'
        timeout-minutes: 15
        env:
          NODE_PATH: ${{ github.workspace }}/api/node_modules
          VECTORWARP_LAYOUT_REPORT: build/ci/browser-acceptance/browser-layout.json
          VECTORWARP_LAYOUT_SCREENSHOTS: build/ci/browser-acceptance/screenshots
          VECTORWARP_LAYOUT_INTERACTIONS: '1'
        run: |
          npm ci --prefix test/browser --ignore-scripts --no-audit --no-fund
          test/browser/node_modules/.bin/playwright install --with-deps chromium
          VECTORWARP_CHROME_EXECUTABLE="$(node -p "require('./test/browser/node_modules/playwright').chromium.executablePath()")" \
            node test/browser/all-routes-layout.cjs
      - name: Preserve browser-route evidence
        if: always() && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-layout-${{ matrix.runner }}-${{ github.sha }}
          path: build/ci/browser-acceptance/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate immutable upstream review artifact
        run: |
          mkdir release-review
          python3 script/upstream-diff.py --baseline docs/UPSTREAM_BASELINE.json \
            --output release-review/upstream-diff.txt
          cp docs/UPSTREAM_BASELINE.json release-review/
      - name: Upload review-only upstream comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-diff-${{ matrix.runner }}-${{ github.sha }}
          path: release-review/
          if-no-files-found: error
          retention-days: 14

  qualified-linux-gpu:
    # Physical qualification is an explicit protected-runner operation. A new
    # main push must be able to finish its hosted checks before that dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.require_gpu_receipts
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/gpu-receipt-gate.yml
    with:
      source-sha: ${{ github.sha }}

  kraken-linux-simulation:
    name: Native Kraken software simulation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install native build dependencies before fetching sources
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake make patch pkg-config python3 binutils \
            libfftw3-dev libeigen3-dev libusb-1.0-0-dev zlib1g-dev libssl-dev
      - name: Test fail-closed simulation audit
        run: python3 test/kraken/test_linux_simulator.py -v
      - name: Compile exact pinned native driver and prepare isolated simulation
        run: python3 test/kraken/build_linux_simulator.py --output-dir build/kraken-linux-prepared --jobs 2
      - name: Build the production companion without opening hardware
        run: |
          sudo apt-get install --yes --no-install-recommends ninja-build
          python3 script/build-kraken.py --output-dir build/kraken-bundled --jobs 2 --test
          python3 test/packaging/test_bundled_kraken.py -v
      - name: Exercise native loopback protocol and calibration with simulated samples
        run: |
          python3 test/macos/kraken/native_simulation_test.py \
            --heimdall build/kraken-linux-prepared/heimdall-simulated \
            --manifest build/kraken-linux-prepared/binary-manifest.json \
            --output build/kraken-linux-evidence
      - name: Collect compact software test evidence
        if: always()
        run: |
          mkdir -p build/kraken-linux-review
          python3 - <<'PY'
          import pathlib, shutil
          target = pathlib.Path('build/kraken-linux-review')
          for name in ('binary-manifest.json', 'simulated-link.txt',
                       'native-compile-flags.txt', 'driver-compile-flags.txt'):
              source = pathlib.Path('build/kraken-linux-prepared') / name
              if source.is_file(): shutil.copy2(source, target / name)
          evidence = pathlib.Path('build/kraken-linux-evidence')
          if evidence.exists():
              for source in evidence.rglob('*'):
                  if source.is_file() and source.suffix in ('.json', '.log', '.jsonl'):
                      destination = target / 'tests' / source.relative_to(evidence)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      if source.stat().st_size <= 262144:
                          shutil.copy2(source, destination)
                      else:
                          destination.write_bytes(source.read_bytes()[-262144:])
          PY
      - name: Upload compact review evidence (no upstream sources or native binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kraken-linux-simulation-${{ matrix.runner }}-${{ github.sha }}
          path: build/kraken-linux-review/
          if-no-files-found: warn
          retention-days: 14
