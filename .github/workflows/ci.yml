name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CPU unit, API, and replay tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Node 24 for API tests
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install CPU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake curl git pkg-config python3-yaml tar unzip xz-utils zip \
            apt-utils createrepo-c gnupg libarmadillo-dev libfftw3-dev rpm
      - name: Exercise SDRplay compiler privilege drop under systemd (no vendor SDK)
        run: |
          sudo python3 test/packaging/sdrplay_child_setup_test.py \
            --helper script/vectorwarp-build-sdrplay.py \
            --unit contrib/systemd/vectorwarp-sdrplay-build.service.in \
            --build-user nobody
      - name: Bootstrap pinned vcpkg manifest dependencies
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git build/ci-deps/vcpkg
          git -C build/ci-deps/vcpkg fetch --depth=1 origin b45fe136ff576ad06105fed78245e765ab35ad16
          git -C build/ci-deps/vcpkg checkout --detach b45fe136ff576ad06105fed78245e765ab35ad16
          build/ci-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p build/ci-manifest
          cp lib/vcpkg-kraken.json build/ci-manifest/vcpkg.json
      - name: Configure CPU-only Kraken test build
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DBLAH2_KRAKEN_ONLY=ON -DBLAH2_GPU=OFF \
            -DBLAH2_OUTPUT_DIR="$PWD/build/ci/bin" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/ci-deps/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$PWD/build/ci-manifest" \
            -DVCPKG_INSTALLED_DIR="$PWD/build/ci/vcpkg_installed"
          cmake --build build/ci --parallel 2
      - name: Run C++ unit and portable replay tests
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error
      - name: Run offline full-processor replay harness
        run: python3 test/recording/processor_replay_test.py --binary build/ci/bin/blah2
      - name: Run offline Pi packaging and diagnostics checks
        run: |
          python3 test/packaging/test_pi_image_manifest.py -v
          python3 bench/test_pi_spike_diagnostics.py -v
          python3 bench/test_live_rspduo_check.py -v
          python3 bench/test_compare_outputs.py -v
      - name: Run repository generator unit and ephemeral integration tests
        run: |
          python3 test/packaging/test_repository.py -v
          VECTORWARP_REPOSITORY_INTEGRATION=1 python3 test/packaging/test_repository.py -v
          python3 test/packaging/test_install_release.py -v
          python3 test/packaging/test_receiver_updates.py -v
          sudo python3 test/packaging/test_receiver_workflow.py -v
          python3 test/packaging/test_sdrplay_build_sdk.py -v
          python3 test/packaging/test_rpm_local_kit.py -v
          sudo python3 test/packaging/test_sdrplay_local_build.py -v
      - name: Run API and UI unit tests
        env:
          NODE_PATH: ${{ github.workspace }}/api/node_modules
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          node --test api/heimdall-timing.test.js
          python3 test/packaging/test_bundled_kraken.py -v
          VECTORWARP_LAUNCHER_TEST_API="$PWD/api" VECTORWARP_LAUNCHER_TEST_NODE="$(command -v node)" python3 test/packaging/test_launcher.py -v
          npm test --prefix api
          npm run test:receiver-management --prefix api
          npm run test:dom --prefix api
          node test/ui/deployment.test.js
      - name: Exercise real unprivileged broker requests with NoNewPrivileges
        run: |
          sudo env "PATH=$PATH" "VECTORWARP_TEST_NODE=$(command -v node)" \
            "NODE_PATH=$GITHUB_WORKSPACE/api/node_modules" \
            python3 test/packaging/test_receiver_helper.py -v
          sudo python3 test/packaging/test_sudoers_migration.py -v
      - name: Run staged native-package acceptance checks
        run: |
          node test/ui/packaging.test.js
          python3 test/packaging/test_sdrplay_distribution.py -v
          python3 test/packaging/test_install_docs.py -v
          python3 test/packaging/test_gpu_setup.py -v
          python3 test/packaging/test_receiver_build.py -v
          sudo python3 test/packaging/test_package_upgrade.py -v
      - name: Syntax-check every workflow shell block and release script
        run: |
          bash -n script/build-native.sh script/install-native.sh script/package-native.sh script/install-release.sh script/smoke-native-package.sh script/test-installed-package.sh
          python3 -m py_compile script/build-package-repository.py
          python3 - <<'PY'
          import pathlib, subprocess, tempfile, yaml
          for workflow in pathlib.Path('.github/workflows').glob('*.yml'):
              document = yaml.safe_load(workflow.read_text())
              for job in document['jobs'].values():
                  for step in job.get('steps', []):
                      if 'run' not in step: continue
                      with tempfile.NamedTemporaryFile(mode='w', suffix='.sh') as script:
                          script.write(step['run']); script.flush()
                          subprocess.run(['bash', '-n', script.name], check=True)
          release = pathlib.Path('.github/workflows/release-packages.yml').read_text()
          assert 'release-assets/package-manifest.json' in release
          assert 'release-assets/repository-manifest.json' in release
          assert 'cp repository/repository-manifest.json release-assets/package-manifest.json' in release
          assert 'cp repository/repository-manifest.json release-assets/repository-manifest.json' in release
          assert 'release-assets/upstream-diff.txt release-assets/UPSTREAM_BASELINE.json' in release
          assert 'script/upstream-diff.py --baseline docs/UPSTREAM_BASELINE.json' in release
          for workflow in ('ci.yml', 'release-packages.yml'):
              text = pathlib.Path('.github/workflows', workflow).read_text()
              assert 'NODE_PATH: $' + '{{ github.workspace }}/api/node_modules' in text
              assert 'npm run test:dom --prefix api' in text and 'node test/ui/deployment.test.js' in text
          helper = pathlib.Path('script/upstream-diff.py').read_text()
          assert 'git diff --stat' in helper and 'git diff --name-status' in helper
          assert 'https://github.com/{upstream}.git' in helper and 'moving branch' in helper
          PY
      - name: Generate immutable upstream review artifact
        run: |
          mkdir release-review
          python3 script/upstream-diff.py --baseline docs/UPSTREAM_BASELINE.json \
            --output release-review/upstream-diff.txt
          cp docs/UPSTREAM_BASELINE.json release-review/
      - name: Upload review-only upstream comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-diff-${{ matrix.runner }}-${{ github.sha }}
          path: release-review/
          if-no-files-found: error
          retention-days: 14

  kraken-linux-simulation:
    name: Native Kraken software simulation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install native build dependencies before fetching sources
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake make patch pkg-config python3 binutils \
            libfftw3-dev libeigen3-dev libusb-1.0-0-dev zlib1g-dev libssl-dev
      - name: Test fail-closed simulation audit
        run: python3 test/kraken/test_linux_simulator.py -v
      - name: Compile exact pinned native driver and prepare isolated simulation
        run: python3 test/kraken/build_linux_simulator.py --output-dir build/kraken-linux-prepared --jobs 2
      - name: Build the production companion without opening hardware
        run: |
          sudo apt-get install --yes --no-install-recommends ninja-build
          python3 script/build-kraken.py --output-dir build/kraken-bundled --jobs 2 --test
          python3 test/packaging/test_bundled_kraken.py -v
      - name: Exercise native loopback protocol and calibration with simulated samples
        run: |
          python3 test/macos/kraken/native_simulation_test.py \
            --heimdall build/kraken-linux-prepared/heimdall-simulated \
            --manifest build/kraken-linux-prepared/binary-manifest.json \
            --output build/kraken-linux-evidence
      - name: Collect compact software test evidence
        if: always()
        run: |
          mkdir -p build/kraken-linux-review
          python3 - <<'PY'
          import pathlib, shutil
          target = pathlib.Path('build/kraken-linux-review')
          for name in ('binary-manifest.json', 'simulated-link.txt',
                       'native-compile-flags.txt', 'driver-compile-flags.txt'):
              source = pathlib.Path('build/kraken-linux-prepared') / name
              if source.is_file(): shutil.copy2(source, target / name)
          evidence = pathlib.Path('build/kraken-linux-evidence')
          if evidence.exists():
              for source in evidence.rglob('*'):
                  if source.is_file() and source.suffix in ('.json', '.log', '.jsonl'):
                      destination = target / 'tests' / source.relative_to(evidence)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      if source.stat().st_size <= 262144:
                          shutil.copy2(source, destination)
                      else:
                          destination.write_bytes(source.read_bytes()[-262144:])
          PY
      - name: Upload compact review evidence (no upstream sources or native binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kraken-linux-simulation-${{ matrix.runner }}-${{ github.sha }}
          path: build/kraken-linux-review/
          if-no-files-found: warn
          retention-days: 14
