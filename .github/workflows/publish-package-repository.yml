name: Publish verified package repository

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Already-published latest stable release tag to republish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  validate-release:
    name: Verify latest published stable release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          releases=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease)
          latest=$(jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' <<<"$releases" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          [[ -n $latest ]]
          case "$GITHUB_EVENT_NAME" in
            release) tag=$EVENT_TAG ;;
            schedule) tag="v$latest" ;;
            push)
              [[ $GITHUB_REF == refs/heads/main ]] || {
                echo 'Automatic refresh requires the protected main branch.' >&2; exit 1; }
              tag="v$latest" ;;
            workflow_dispatch) tag=$INPUT_TAG ;;
            *) echo 'Unsupported repository publication event.' >&2; exit 1 ;;
          esac
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          selected=$(jq -r --arg tag "$tag" '.[] | select(.tagName == $tag) | select(.isDraft == false and .isPrerelease == false) | .tagName' <<<"$releases")
          [[ $selected == "$tag" ]]
          [[ -n $latest && $tag == "v$latest" ]] || {
            echo 'Refusing to roll the repository back from its latest stable release.' >&2; exit 1; }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  rebuild-repository:
    name: Rebuild signed repository from reviewed assets
    needs: validate-release
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - name: Check out trusted default-branch repository generator
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
      - name: Download and verify reviewed release package assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir packages
          gh release download "$TAG" --dir packages --pattern 'vectorwarp_*.deb' \
            --pattern 'vectorwarp-*.rpm' --pattern SHA256SUMS --pattern SHA256SUMS.asc \
            --pattern vectorwarp-archive-key.asc --pattern signing-fingerprint.txt \
            --pattern package-manifest.json --pattern repository-manifest.json \
            --pattern upstream-diff.txt --pattern UPSTREAM_BASELINE.json
          cmp packages/vectorwarp-archive-key.asc packaging/keys/vectorwarp.asc
          release_fingerprint=$(tr -d '[:space:]' < packages/signing-fingerprint.txt)
          [[ $FINGERPRINT =~ ^[A-Fa-f0-9]{40}$ && ${release_fingerprint^^} == ${FINGERPRINT^^} ]]
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/vectorwarp-release-keyring.gpg" \
            packages/vectorwarp-archive-key.asc
          gpgv --keyring "$RUNNER_TEMP/vectorwarp-release-keyring.gpg" \
            packages/SHA256SUMS.asc packages/SHA256SUMS
          (cd packages && sha256sum --check --strict SHA256SUMS)
          test -f packages/package-manifest.json
          git fetch --no-tags origin "refs/tags/${TAG}:refs/vectorwarp-release-candidate/${TAG}"
          tag_commit=$(git rev-parse "refs/vectorwarp-release-candidate/${TAG}^{commit}")
          manifest_version=$(jq -er '.version | select(type == "string")' packages/package-manifest.json)
          manifest_commit=$(jq -er '.source_commit | select(type == "string")' packages/package-manifest.json)
          [[ $manifest_version == "${TAG#v}" && ${manifest_commit,,} == ${tag_commit,,} ]] || {
            echo 'Release assets do not match the immutable release tag.' >&2; exit 1; }
          printf 'RELEASE_VERSION=%s\nRELEASE_COMMIT=%s\n' "$manifest_version" "$tag_commit" >> "$GITHUB_ENV"
      - name: Install repository signing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils createrepo-c gnupg rpm
      - name: Fail closed unless repository signing is configured
        env:
          SIGNING_KEY: ${{ secrets.VECTORWARP_ARCHIVE_SIGNING_KEY }}
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n $SIGNING_KEY && $FINGERPRINT =~ ^[A-Fa-f0-9]{40}$ ]]
          [[ -f packaging/keys/vectorwarp.asc && -f script/build-package-repository.py && -f script/install-release.sh ]]
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          actual=$(gpg --batch --with-colons --fingerprint "$FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ ${actual^^} == ${FINGERPRINT^^} ]]
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Rebuild fresh metadata and signed repository tree
        env:
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          python3 script/build-package-repository.py --packages packages --manifest packages/package-manifest.json \
            --output repository --public-key packaging/keys/vectorwarp.asc \
            --fingerprint "$FINGERPRINT" --signing-key "$FINGERPRINT" \
            --installer-template script/install-release.sh \
            --expected-version "$RELEASE_VERSION" --expected-source-commit "$RELEASE_COMMIT" \
            --require-release-matrix
          test -f repository/repository-manifest.json -a -f repository/install.sh
          test $(du -sm repository | awk '{print $1}') -le 900
      - name: Stage fresh repository for protected Pages deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-package-repository
          path: repository/
          if-no-files-found: error
          retention-days: 1
  publish-pages:
    name: Publish signed repository to GitHub Pages
    needs: rebuild-repository
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download freshly rebuilt repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-package-repository
          path: repository
      - name: Validate deployment input
        run: |
          set -euo pipefail
          test -f repository/repository-manifest.json -a -f repository/install.sh
          test $(du -sm repository | awk '{print $1}') -le 900
      - name: Upload bounded signed repository artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: repository
      - id: deployment
        name: Deploy reviewed repository
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Check public installation page and downloads
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          [[ $PAGE_URL == https://mickeyslaven.github.io/blah2-VectorWarp/ ]]
          # Allow bounded CDN propagation, but never call a stale page success.
          for file in index.html install.sh repository-manifest.json keys/vectorwarp.asc; do
            matched=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 10 --max-time 20 --header 'Cache-Control: no-cache' \
                "${PAGE_URL}${file}?deployment=${GITHUB_RUN_ID}" --output "$RUNNER_TEMP/vectorwarp-public-file" &&
                cmp --silent "repository/$file" "$RUNNER_TEMP/vectorwarp-public-file"; then
                matched=true; break
              fi
              sleep 5
            done
            $matched || { echo "Public repository file is unavailable or stale: $file" >&2; exit 1; }
          done
          version=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' repository/repository-manifest.json)
          filenames=$(jq -er '.packages | select(type == "array" and length == 10) |
            map(.filename) | select(all(.[]; type == "string" and
            test("^vectorwarp[-_][A-Za-z0-9_.+-]+\\.(deb|rpm)$"))) |
            select(length == (unique | length)) | .[]' repository/repository-manifest.json)
          while IFS= read -r filename; do
            curl --fail --silent --show-error --head --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 30 --retry 2 --output /dev/null \
              "https://github.com/mickeyslaven/blah2-VectorWarp/releases/download/v${version}/${filename}"
          done <<< "$filenames"
