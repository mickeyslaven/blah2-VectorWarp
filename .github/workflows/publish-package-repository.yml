name: Publish verified package repository

on:
  # Publication is separately authorized; merging CI changes or publishing a
  # release must not silently redeploy the public package repository.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Already-published latest stable release tag to republish'
        required: true
        type: string
      release_sha:
        description: 'Exact 40-character source commit of the reviewed release tag'
        required: true
        type: string
      publish:
        description: 'Rebuild, sign, and deploy this already-published release to Pages'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  validate-release:
    name: Verify latest published stable release
    if: github.repository == 'mickeyslaven/blah2-VectorWarp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REPOSITORY == mickeyslaven/blah2-VectorWarp &&
             $GITHUB_REF == refs/heads/main ]] || {
            echo 'Repository publication requires a trusted main dispatch.' >&2; exit 1; }
          [[ $INPUT_RELEASE_SHA =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Pin the reviewed release to its full source commit.' >&2; exit 1; }
          releases=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease)
          latest=$(jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' <<<"$releases" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          [[ -n $latest ]]
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) tag=$INPUT_TAG ;;
            *) echo 'Unsupported repository publication event.' >&2; exit 1 ;;
          esac
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          selected=$(jq -r --arg tag "$tag" '.[] | select(.tagName == $tag) | select(.isDraft == false and .isPrerelease == false) | .tagName' <<<"$releases")
          [[ $selected == "$tag" ]]
          [[ -n $latest && $tag == "v$latest" ]] || {
            echo 'Refusing to roll the repository back from its latest stable release.' >&2; exit 1; }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  rebuild-repository:
    name: Rebuild signed repository from reviewed assets
    needs: validate-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - name: Check out immutable trusted repository generator
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publication opt-in and trusted workflow revision
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ $GITHUB_EVENT_NAME == workflow_dispatch && $PUBLISH == true &&
             $GITHUB_REPOSITORY == mickeyslaven/blah2-VectorWarp &&
             $GITHUB_REF == refs/heads/main ]]
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          current_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          [[ $current_main == "$GITHUB_SHA" ]] || {
            echo 'Main advanced; dispatch and review the new workflow revision.' >&2; exit 1; }
      - name: Download and verify reviewed release package assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir packages
          gh release download "$TAG" --dir packages --pattern 'vectorwarp_*.deb' \
            --pattern 'vectorwarp-*.rpm' --pattern SHA256SUMS --pattern SHA256SUMS.asc \
            --pattern vectorwarp-archive-key.asc --pattern signing-fingerprint.txt \
            --pattern package-manifest.json --pattern repository-manifest.json \
            --pattern upstream-diff.txt --pattern UPSTREAM_BASELINE.json \
            --pattern release-soak-provenance.json
          cmp packages/vectorwarp-archive-key.asc packaging/keys/vectorwarp.asc
          release_fingerprint=$(tr -d '[:space:]' < packages/signing-fingerprint.txt)
          [[ $FINGERPRINT =~ ^[A-Fa-f0-9]{40}$ && ${release_fingerprint^^} == ${FINGERPRINT^^} ]]
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/vectorwarp-release-keyring.gpg" \
            packages/vectorwarp-archive-key.asc
          gpgv --keyring "$RUNNER_TEMP/vectorwarp-release-keyring.gpg" \
            packages/SHA256SUMS.asc packages/SHA256SUMS
          (cd packages && sha256sum --check --strict SHA256SUMS)
          test -f packages/package-manifest.json
          git fetch --no-tags origin "refs/tags/${TAG}:refs/vectorwarp-release-candidate/${TAG}"
          tag_commit=$(git rev-parse "refs/vectorwarp-release-candidate/${TAG}^{commit}")
          [[ $tag_commit == "$EXPECTED_RELEASE_SHA" ]] || {
            echo 'Release tag moved or differs from the explicitly authorized commit.' >&2; exit 1; }
          manifest_version=$(jq -er '.version | select(type == "string")' packages/package-manifest.json)
          manifest_commit=$(jq -er '.source_commit | select(type == "string")' packages/package-manifest.json)
          [[ $manifest_version == "${TAG#v}" && ${manifest_commit,,} == ${tag_commit,,} ]] || {
            echo 'Release assets do not match the immutable release tag.' >&2; exit 1; }
          macos_filename="vectorwarp-${manifest_version}-macos-universal.pkg"
          macos_digest=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"${macos_filename}\") | .digest")
          if [[ -n $macos_digest ]]; then
            [[ $macos_digest =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo 'Mac release asset has no verified SHA-256 digest.' >&2; exit 1; }
            macos_source="vectorwarp-${manifest_version}-macos-corresponding-source.tar.gz"
            source_digest=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"${macos_source}\") | .digest")
            [[ $source_digest =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo 'Mac corresponding source has no verified SHA-256 digest.' >&2; exit 1; }
            gh release download "$TAG" --dir packages --pattern "$macos_filename" \
              --pattern "$macos_source" --pattern macos-release.json
            [[ -f packages/$macos_filename && -f packages/$macos_source && -f packages/macos-release.json ]] || {
              echo 'Mac release asset, source, or receipt is missing.' >&2; exit 1; }
            printf '%s  %s\n' "${macos_digest#sha256:}" "packages/$macos_filename" | sha256sum --check --strict
            printf '%s  %s\n' "${source_digest#sha256:}" "packages/$macos_source" | sha256sum --check --strict
            printf 'MACOS_RELEASE_FILE=packages/macos-release.json\n' >> "$GITHUB_ENV"
          fi
          printf 'RELEASE_VERSION=%s\nRELEASE_COMMIT=%s\n' "$manifest_version" "$tag_commit" >> "$GITHUB_ENV"
      - name: Verify signed soak provenance matches every released package
        run: |
          set -euo pipefail
          receipt=packages/release-soak-provenance.json
          [[ -f $receipt && ! -L $receipt ]]
          receipt_sha=$(awk '$2 == "release-soak-provenance.json" {print $1}' packages/SHA256SUMS)
          [[ $receipt_sha =~ ^[0-9a-f]{64}$ ]] || {
            echo 'The soak provenance must be covered exactly once by signed SHA256SUMS.' >&2; exit 1; }
          printf '%s  %s\n' "$receipt_sha" "$receipt" | sha256sum --check --strict
          jq -e --arg source "$RELEASE_COMMIT" --arg version "$RELEASE_VERSION" \
            --slurpfile manifest packages/package-manifest.json '
              .schema == 1 and .source_commit == $source and .version == $version and
              (.packages | type == "object") and
              ((.packages | with_entries(.value = .value.signedPackageSha256)) ==
               ($manifest[0].packages | map({key: .filename, value: .sha256}) | from_entries))' \
            "$receipt" >/dev/null
      - name: Install repository signing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils createrepo-c gnupg rpm
      - name: Fail closed unless repository signing is configured
        env:
          SIGNING_KEY: ${{ secrets.VECTORWARP_ARCHIVE_SIGNING_KEY }}
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n $SIGNING_KEY && $FINGERPRINT =~ ^[A-Fa-f0-9]{40}$ ]]
          [[ -f packaging/keys/vectorwarp.asc && -f script/build-package-repository.py && -f script/install-release.sh ]]
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          actual=$(gpg --batch --with-colons --fingerprint "$FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ ${actual^^} == ${FINGERPRINT^^} ]]
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Rebuild fresh metadata and signed repository tree
        env:
          FINGERPRINT: ${{ vars.VECTORWARP_ARCHIVE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          macos_args=()
          if [[ -n ${MACOS_RELEASE_FILE:-} ]]; then
            macos_args=(--macos-release "$MACOS_RELEASE_FILE")
          fi
          python3 script/build-package-repository.py --packages packages --manifest packages/package-manifest.json \
            --output repository --public-key packaging/keys/vectorwarp.asc \
            --fingerprint "$FINGERPRINT" --signing-key "$FINGERPRINT" \
            --installer-template script/install-release.sh \
            --expected-version "$RELEASE_VERSION" --expected-source-commit "$RELEASE_COMMIT" \
            --require-release-matrix "${macos_args[@]}"
          test -f repository/repository-manifest.json -a -f repository/install.sh
          test $(du -sm repository | awk '{print $1}') -le 900
      - name: Record publication authorization with the reviewed repository
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg actor "$GITHUB_ACTOR" \
            --arg triggering_actor "$GITHUB_TRIGGERING_ACTOR" --arg workflow_sha "$GITHUB_SHA" \
            --arg release_tag "$TAG" --arg release_sha "$RELEASE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 1, authorization: "workflow_dispatch:publish=true", repository: $repository,
              actor: $actor, triggering_actor: $triggering_actor, workflow_sha: $workflow_sha,
              release_tag: $release_tag, release_sha: $release_sha,
              run_id: $run_id, run_attempt: $run_attempt}' > repository/publication-authorization.json
          cat repository/publication-authorization.json >> "$GITHUB_STEP_SUMMARY"
      - name: Stage fresh repository for protected Pages deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-package-repository
          path: repository/
          if-no-files-found: error
          retention-days: 1
  publish-pages:
    name: Publish signed repository to GitHub Pages
    needs: rebuild-repository
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download freshly rebuilt repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-package-repository
          path: repository
      - name: Validate deployment input
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f repository/repository-manifest.json -a -f repository/install.sh
          jq -e --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg release_sha "$EXPECTED_RELEASE_SHA" --arg tag "$TAG" \
            '.authorization == "workflow_dispatch:publish=true" and .workflow_sha == $sha and
             .run_id == $run_id and .run_attempt == $attempt and
             .release_sha == $release_sha and .release_tag == $tag' \
            repository/publication-authorization.json >/dev/null
          tag_refs=$(git ls-remote https://github.com/mickeyslaven/blah2-VectorWarp.git \
            "refs/tags/$TAG" "refs/tags/$TAG^{}")
          tag_commit=$(awk '$2 ~ /\^\{\}$/ { peeled=$1; next } { direct=$1 }
            END { print peeled ? peeled : direct }' <<< "$tag_refs")
          [[ $tag_commit == "$EXPECTED_RELEASE_SHA" ]] || {
            echo 'Release tag moved after signing; refusing publication.' >&2; exit 1; }
          test $(du -sm repository | awk '{print $1}') -le 900
      - name: Upload bounded signed repository artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: repository
      - id: deployment
        name: Deploy reviewed repository
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-pages:
    name: Verify public installation page and downloads
    needs: [rebuild-repository, publish-pages]
    runs-on: ubuntu-24.04
    steps:
      - name: Download freshly rebuilt repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-package-repository
          path: repository
      - name: Check public installation page and downloads
        env:
          PAGE_URL: https://mickeyslaven.github.io/blah2-VectorWarp/
        run: |
          set -euo pipefail
          if [[ "${PAGE_URL:-}" != "https://mickeyslaven.github.io/blah2-VectorWarp/" ]]; then
            echo 'Unexpected deployment URL.' >&2; exit 1
          fi
          # Allow bounded CDN propagation, but never call a stale page success.
          for file in index.html install.sh repository-manifest.json keys/vectorwarp.asc; do
            matched=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 10 --max-time 20 --header 'Cache-Control: no-cache' \
                "${PAGE_URL}${file}?deployment=${GITHUB_RUN_ID}" --output "$RUNNER_TEMP/vectorwarp-public-file" &&
                cmp --silent "repository/$file" "$RUNNER_TEMP/vectorwarp-public-file"; then
                matched=true; break
              fi
              sleep 30
            done
            $matched || { echo "Public repository file is unavailable or stale: $file" >&2; exit 1; }
          done
          version=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' repository/repository-manifest.json)
          expected_packages=11
          if [[ $(printf '%s\n' "$version" 0.1.10 | sort -V | head -n 1) != 0.1.10 ]]; then expected_packages=10; fi
          filenames=$(jq -er --argjson expected_packages "$expected_packages" '.packages | select(type == "array" and length == $expected_packages) |
            map(.filename) | select(all(.[]; type == "string" and
            test("^vectorwarp[-_][A-Za-z0-9_.+-]+\\.(deb|rpm)$"))) |
            select(length == (unique | length)) | .[]' repository/repository-manifest.json)
          while IFS= read -r filename; do
            curl --fail --silent --show-error --head --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 30 --retry 2 --output /dev/null \
              "https://github.com/mickeyslaven/blah2-VectorWarp/releases/download/v${version}/${filename}"
          done <<< "$filenames"
          macos_filename=$(jq -r '.macos_package.filename // empty' repository/repository-manifest.json)
          if [[ -n $macos_filename ]]; then
            [[ $macos_filename == "vectorwarp-${version}-macos-universal.pkg" ]]
            macos_source=$(jq -er '.macos_package.source_archive.filename' repository/repository-manifest.json)
            [[ $macos_source == "vectorwarp-${version}-macos-corresponding-source.tar.gz" ]]
            for asset in "$macos_filename" "$macos_source"; do
              curl --fail --silent --show-error --head --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 10 --max-time 30 --retry 2 --output /dev/null \
                "https://github.com/mickeyslaven/blah2-VectorWarp/releases/download/v${version}/${asset}"
            done
          fi
