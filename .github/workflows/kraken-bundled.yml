name: Bundled Kraken source contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distro:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            distro: fedora44
            image: registry.fedoraproject.org/fedora@sha256:c1e938afd5dfd7f172fac9168ba8e148fdf41c0517c04849072a15e4bd34eac6
          - runner: ubuntu-24.04-arm
            distro: debian12-pi
            image: docker.io/library/debian@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - name: Install build dependencies without receiver access
        shell: bash
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install git gcc-c++ cmake ninja-build make patch python3 pkgconf-pkg-config eigen3-devel libusb1-devel openssl-devel zlib-devel binutils tar
          else
            apt-get update
            apt-get install -y --no-install-recommends git g++ cmake ninja-build make patch python3 pkg-config libeigen3-dev libusb-1.0-0-dev libssl-dev zlib1g-dev binutils ca-certificates
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Build pinned companion and run deterministic upstream tests
        run: python3 script/build-kraken.py --jobs 2 --test --output-dir build/companion
      - name: Verify package lifecycle and binary provenance contracts
        run: python3 test/packaging/test_bundled_kraken.py -v
      - name: Upload provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kraken-${{ matrix.distro }}-${{ matrix.runner }}
          path: |
            build/companion/share/heimdall/build.json
            build/companion/share/heimdall/sbom.cdx.json
          retention-days: 14
